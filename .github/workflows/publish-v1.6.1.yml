name: Refresh public v1.6.1 release notes

on:
  push:
    branches:
      - release/v1.6.1-publication

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out public documentation
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Refresh release body and release-note asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp releases/v1.6.1.md RELEASE-NOTES-v1.6.1.md
          gh release edit v1.6.1             --repo ${{ github.repository }}             --title "한의원 AI 경영컨설턴트 v1.6.1"             --notes-file releases/v1.6.1.md
          gh release upload v1.6.1 RELEASE-NOTES-v1.6.1.md             --repo ${{ github.repository }}             --clobber
